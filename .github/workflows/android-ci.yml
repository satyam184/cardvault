name: Flutter Android CI

on:
  push:
    branches:
      - main
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Shorebird
        run: |
          curl --proto '=https' --tlsv1.2 https://raw.githubusercontent.com/shorebirdtech/install/main/install.sh -sSf | bash

      - name: Add Shorebird to PATH
        run: echo "$HOME/.shorebird/bin" >> $GITHUB_PATH

      - name: Login Shorebird
        run: shorebird login --token=${{ secrets.SHOREBIRD_TOKEN }}

      - name: Create .env
        run: |
          touch .env

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Shorebird APK
        run: shorebird release android --artifact apk

      - name: Upload to Loadly
        run: |
          curl -X POST \
          "https://api.loadly.io/apiv2/app/upload" \
          -F "_api_key=${{ secrets.LOADLY_API_KEY }}" \
          -F "file=@build/app/outputs/flutter-apk/app-release.apk" \
          -F "release_notes=New automated build from GitHub Actions"
