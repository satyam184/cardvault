name: Flutter Android CI

on:
  push:
    branches:
      - main
      - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"

      - name: Create .env
        run: touch .env

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        # with:
        #   flutter-version: "3.44.0"

      - name: Build Shorebird APK
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: shorebird release android --artifact apk

      - name: Upload to Loadly
        run: |
          curl -X POST \
          "https://api.loadly.io/apiv2/app/upload" \
          -F "_api_key=${{ secrets.LOADLY_API_KEY }}" \
          -F "file=@build/app/outputs/flutter-apk/app-release.apk" \
          -F "release_notes=New automated build from GitHub Actions"
